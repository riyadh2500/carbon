<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded square background -->
  <rect width="36" height="36" rx="9" fill="#111a11"/>
  <!--
    Organic F/₹ mark — matches logu.png:
    Two horizontal rounded pill bars stacked,
    connected by a vertical rounded stem on the left.
    Mint/teal color #a8e6cf.
  -->
  <!-- Left vertical stem -->
  <rect x="8.5" y="8.5" width="5.5" height="19" rx="2.75" fill="#a8e6cf"/>
  <!-- Top horizontal pill -->
  <rect x="8.5" y="8.5" width="15" height="5.5" rx="2.75" fill="#a8e6cf"/>
  <!-- Bottom horizontal pill (shorter, offset right) -->
  <rect x="11" y="18" width="13" height="5.5" rx="2.75" fill="#a8e6cf"/>
  <!-- Small bottom-right hook (matches the curved tail in reference) -->
  <rect x="19" y="20.5" width="5" height="5.5" rx="2.75" fill="#a8e6cf"/>
</svg>
